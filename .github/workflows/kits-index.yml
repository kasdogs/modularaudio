# Rebuilds kits/index.json whenever audio files under kits/ change,
# so samples uploaded through GitHub (or pushed) show up in the Drum Sampler.
name: Update drum kit index
on:
  push:
    branches: [main]
    paths: ['kits/**', '!kits/index.json', '_tools/build_kits_index.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kits-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build index
        run: python3 _tools/build_kits_index.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- kits/index.json; then echo "Index already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kits/index.json
          git commit -m "Update drum kit index"
          git push
